import com.vanniktech.maven.publish.AndroidSingleVariantLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

plugins {
    alias(libs.plugins.android.library)
    id("de.undercouch.download") version "5.7.0"
    alias(libs.plugins.maven.publish)
}

// Distribution (both channels are published for now; JitPack will be dropped
// in a future release):
// - Maven Central: io.github.dalgarins:android-spatialite, from 2.2.3 on.
//   Published by .github/workflows/publish.yml when a GitHub Release is
//   published; the version is taken from the release tag (-PVERSION_NAME).
// - JitPack: com.github.dalgarins:android-spatialite, built on demand from the
//   tag (JitPack sets JITPACK=true and VERSION=<tag>). Legacy channel, and the
//   only one for 2.2.1 and earlier.
def isJitpack = System.getenv('JITPACK') == 'true'
group = isJitpack ? 'com.github.dalgarins' : 'io.github.dalgarins'

// No default version: publishing without one fails (see the check below), while
// regular builds and IDE syncs still work as 'unspecified'.
def versionName = providers.gradleProperty('VERSION_NAME').getOrNull()
        ?: (isJitpack ? System.getenv('VERSION') : null)
version = versionName ?: 'unspecified'

tasks.matching { it.name.startsWith('publish') }.configureEach {
    doFirst {
        if (!versionName) {
            throw new GradleException("VERSION_NAME is required to publish: run with -PVERSION_NAME=<version>")
        }
    }
}

android {
    namespace = 'org.spatialite'
    compileSdk = 37
    // Must match the build-tools installed by jitpack.yml and .github/workflows/publish.yml.
    buildToolsVersion = '37.0.0'
    ndkVersion = '27.3.13750724'

    defaultConfig {
        minSdk = 23

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        externalNativeBuild {
            ndkBuild {
                arguments "-j8", "V=1"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets.main.jni.srcDirs = ['src/main/none']

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }
}

ext {
    sqliteDistributionUrl = 'https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip'
}

tasks.register('downloadSqlite', Download) {
    src project.sqliteDistributionUrl
    dest 'src/main/jni/ndk-modules/sqlite/sqlite.zip'
}

tasks.register('installSqlite', Copy) {
    dependsOn downloadSqlite
    from zipTree(downloadSqlite.dest).matching {
        include '*/sqlite3.*'
        eachFile { it.setPath(it.getName()) }
    }
    into 'src/main/jni/ndk-modules/sqlite'
}

preBuild.dependsOn installSqlite

dependencies {

    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

mavenPublishing {
    configure(new AndroidSingleVariantLibrary(new JavadocJar.Javadoc(), new SourcesJar.Sources(), 'release'))

    coordinates(project.group.toString(), 'android-spatialite', project.version.toString())

    publishToMavenCentral(true)

    // Only sign when a key is available, so JitPack and local builds work without GPG.
    if (providers.gradleProperty('signingInMemoryKey').isPresent()) {
        signAllPublications()
    }

    pom {
        name = "android-spatialite"
        description = "The Spatialite database ported for Android"
        url = "https://github.com/dalgarins/android-spatialite"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        scm {
            connection = 'scm:git:git://github.com/dalgarins/android-spatialite.git'
            developerConnection = 'scm:git:ssh://git@github.com/dalgarins/android-spatialite.git'
            url = 'https://github.com/dalgarins/android-spatialite'
        }
        developers {
            developer {
                id = 'dalgarins'
                name = 'Darwin Algarin'
                email = 'dalgarins@anbora.co'
                organization = "Anbora labs"
                organizationUrl = "https://labs.anbora.co"
            }
        }
    }
}

publishing {
    repositories {
        maven {
            url = uri(layout.buildDirectory.dir("repos/releases"))
        }
    }
}
